<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3a1650">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>あまあまマッチ</title>
<style>
:root{ --ink:#3a1650; --accent:#ff3d7f; --gold:#ffc83d; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Rounded Mplus 1c","Yu Gothic UI",system-ui,sans-serif;
  color:var(--ink);user-select:none;-webkit-user-select:none;
  background:linear-gradient(170deg,#ff8fc0 0%,#c765c9 45%,#5b2a8c 100%);
}
button{font:inherit;color:inherit;cursor:pointer}

/* ふわふわ背景 */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,#fff2 60%,transparent 70%);
  animation:floaty linear infinite;opacity:.55}
@keyframes floaty{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ---------- マップ ---------- */
#map{overflow-y:auto}
.logo{margin:16px 0 0;font-size:46px;line-height:1.02;text-align:center;font-weight:900;letter-spacing:2px;
  color:#fff;-webkit-text-stroke:2px #fff;
  text-shadow:0 4px 0 #ff3d7f,0 8px 0 #7a1f6a,0 14px 24px #0006;transform:rotate(-3deg)}
.candyrow{display:flex;gap:4px;margin:14px 0 4px}
.candyrow .gem{width:34px;height:34px;animation:bob 1.6s ease-in-out infinite}
.sub{margin:6px 0 16px;color:#fff;font-weight:bold;text-shadow:0 2px 0 #0003}
#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(100%,420px);padding-bottom:30px}
.lv{aspect-ratio:1;border:none;border-radius:50%;padding:0;
  background:radial-gradient(circle at 35% 28%,#fff 0 12%,#ffd6e7 30%,#ff8fbd 75%);
  box-shadow:inset 0 -5px 0 #0001,0 5px 0 #b72b6e,0 8px 12px #0003;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:21px;color:var(--ink)}
.lv small{font-size:10px;color:#e0a100;letter-spacing:-1px;line-height:1;text-shadow:0 1px 0 #fff}
.lv.current{animation:bob 1.2s ease-in-out infinite;background:radial-gradient(circle at 35% 28%,#fff 0 12%,#fff3b0 30%,#ffc020 75%);box-shadow:inset 0 -5px 0 #0001,0 5px 0 #b07400,0 8px 14px #0004}
.lv.locked{background:#ffffff40;box-shadow:0 4px 0 #0002;color:#0004;font-size:16px}
.lv:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b72b6e}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- ゲーム画面 ---------- */
.hud{width:min(100%,520px);display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border:none;border-radius:14px;background:#fffd;font-size:28px;font-weight:900;line-height:1;box-shadow:0 4px 0 #0003}
.hud-level{flex:1;color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 0 #0004}
.hud-moves{background:linear-gradient(#fff,#ffe3f0);border-radius:18px;padding:4px 14px;text-align:center;box-shadow:0 4px 0 #b72b6e;min-width:80px}
.hud-moves span{display:block;font-size:11px;font-weight:bold}
.hud-moves b{font-size:30px;line-height:1;display:inline-block}
.hud-moves b.bump{animation:bump .3s}
.hud-moves.low b{color:#e5194f}
@keyframes bump{40%{transform:scale(1.35)}}
.info{width:min(100%,520px);margin:8px 0 6px;background:#fffe;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 #0003}
.goal{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:bold;font-size:15px;min-height:28px}
.goal b{font-size:21px}
.goal.done{color:#16a34a}
.goal .gem{width:28px;height:28px;display:inline-block}
.scorerow{display:flex;align-items:center;gap:10px;margin-top:6px}
.scorebar{position:relative;flex:1;height:14px;border-radius:8px;background:#0002;box-shadow:inset 0 2px 3px #0002}
#scoreFill{height:100%;width:0;border-radius:8px;background:linear-gradient(#ffa6cb,#ff3d7f 60%,#e0206a);transition:width .35s;box-shadow:inset 0 2px 0 #fff6}
.mark{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:20px;color:#0003;line-height:1;transition:.2s}
.mark.on{color:var(--gold);text-shadow:0 2px 0 #b07800;transform:translate(-50%,-50%) scale(1.2)}
.score{font-weight:bold;font-size:13px;white-space:nowrap;min-width:84px;text-align:right}
.score b{font-size:19px}

#boardWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#boardWrap.shake1{animation:shake1 .3s}
#boardWrap.shake2{animation:shake2 .45s}
@keyframes shake1{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shake2{10%{transform:translate(-8px,4px) rotate(-.6deg)}25%{transform:translate(8px,-5px) rotate(.6deg)}40%{transform:translate(-7px,3px)}55%{transform:translate(6px,-3px)}70%{transform:translate(-4px,2px)}85%{transform:translate(2px,-1px)}}
#board{--s:44px;position:relative;touch-action:none;border-radius:18px;
  background:rgba(55,15,85,.5);box-shadow:0 0 0 4px #ffffffaa,0 0 0 8px #ff8fc066,0 12px 30px #0005}
.cell{position:absolute;width:calc(var(--s) - 3px);height:calc(var(--s) - 3px);margin:1.5px;border-radius:22%;background:#ffffff26}
.cell.alt{background:#ffffff14}
.tile{position:absolute;left:0;top:0;width:var(--s);height:var(--s);display:grid;place-items:center;
  transition:transform .18s ease-in-out;pointer-events:none;will-change:transform}
.gem{position:relative;width:94%;height:94%;background:center/contain no-repeat;transition:transform .15s,filter .15s;transform-origin:50% 80%}
.gem.sel{transform:scale(1.18);filter:brightness(1.18) drop-shadow(0 0 5px #fff)}
.gem.special{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.25) drop-shadow(0 0 5px #fff)}}
.gem.armed{animation:armed .22s ease-in-out infinite;filter:brightness(1.4) drop-shadow(0 0 8px #fff6a0)}
@keyframes armed{50%{transform:scale(1.15)}}
.cand-bomb{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gem.land{animation:land .24s ease-out}
@keyframes land{0%{transform:scale(1.12,.82)}55%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
.gem.spawn{animation:spawn .35s ease-out}
@keyframes spawn{0%{transform:scale(0) rotate(-30deg)}65%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.gem.hint{animation:wiggle .8s ease-in-out infinite}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(12deg) scale(1.1)}60%{transform:rotate(-8deg)}80%{transform:rotate(0)}}
.gem.pop{animation:pop .22s ease-in forwards}
@keyframes pop{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.35);filter:brightness(2)}100%{transform:scale(0);filter:brightness(3);opacity:0}}

#fx{position:fixed;left:0;top:0;pointer-events:none;z-index:20}
#word{position:fixed;left:50%;top:50%;pointer-events:none;z-index:30;white-space:nowrap;opacity:0;
  font-size:clamp(38px,12vw,60px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(#fffbe0 10%,#ffd23f 50%,#ff8a00 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #8a2a00;filter:drop-shadow(0 4px 0 #5a1440) drop-shadow(0 8px 14px #0007)}
#word.show{animation:word 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes word{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-55%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9) rotate(-4deg)}}

/* ---------- モーダル ---------- */
#modal{position:fixed;inset:0;background:#25083799;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.hidden{display:none}
.card{background:linear-gradient(#fff,#ffeef6);border-radius:26px;padding:22px 20px;width:min(100%,340px);text-align:center;box-shadow:0 10px 0 #b72b6e,0 20px 40px #0005;animation:spawn .4s}
.card h2{margin:0 0 6px;font-size:34px;color:var(--accent);text-shadow:0 3px 0 #ffd0e2}
.card p{margin:6px 0;font-weight:bold}
.stars{font-size:54px;letter-spacing:4px;margin:6px 0;color:#e8dce4}
.stars span{display:inline-block}
.stars .on{color:var(--gold);text-shadow:0 4px 0 #c78a00;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes starIn{0%{transform:scale(3) rotate(-90deg);opacity:0}100%{transform:scale(1)}}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{border:none;border-radius:18px;padding:12px 18px;font-weight:900;font-size:17px;background:#eee;box-shadow:0 4px 0 #0002}
.btn.main{background:linear-gradient(#ff8fbd,#ff3d7f);color:#fff;box-shadow:0 4px 0 #b5245c;text-shadow:0 1px 0 #0003}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
</style>
</head>
<body>
<div id="bg"></div>

<section id="map" class="screen active">
  <div class="logo">あまあま<br>マッチ</div>
  <div class="candyrow" id="candyrow"></div>
  <p class="sub">おなじおかしを 3つそろえよう</p>
  <div id="levels"></div>
</section>

<section id="game" class="screen">
  <header class="hud">
    <button id="backBtn" class="icon-btn" aria-label="マップにもどる">‹</button>
    <div class="hud-level">レベル <span id="lvNum">1</span></div>
    <div class="hud-moves" id="movesBox"><span>のこり手数</span><b id="moves">20</b></div>
  </header>
  <div class="info">
    <div class="goal" id="goal"></div>
    <div class="scorerow">
      <div class="scorebar"><div id="scoreFill"></div><i class="mark" id="m0">★</i><i class="mark" id="m1">★</i><i class="mark" id="m2">★</i></div>
      <div class="score"><b id="score">0</b> 点</div>
    </div>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
</section>

<canvas id="fx"></canvas>
<div id="word"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>

<script>
"use strict";
const ROWS = 8, COLS = 8;
const $ = id => document.getElementById(id);
const board = $('board');
const wait = ms => new Promise(r => setTimeout(r, ms));

let grid = [], nextId = 1, level = null, moves = 0, score = 0, shownScore = 0, collected = 0;
let busy = false, ended = false, selected = null, hintTimer = null, scoreReached = false;

/* ================= おかしの絵 (SVG) ================= */
const PAL = [
  ['#ffb0c0', '#ff2d55', '#a3001f'],  // いちごハート
  ['#ffd9a3', '#ff8a00', '#b04800'],  // オレンジ玉
  ['#fff8b8', '#ffd000', '#b07f00'],  // レモンスター
  ['#ccffb5', '#3ed34a', '#0f7a26'],  // メロングミ
  ['#bdeeff', '#2a9dff', '#0a52b0'],  // ソーダしずく
  ['#f0cdff', '#a64dff', '#5e0fb0'],  // ぶどうジュエル
];
const HEX = ['#ff4d6d', '#ff9a1f', '#ffd400', '#46d652', '#3aa6ff', '#b363ff'];
function starPath(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rad).toFixed(1) + ' ' + (cy + Math.sin(a) * rad).toFixed(1); }
  return d + 'Z';
}
const SHAPES = [
  'M50 88C22 68 8 52 8 34C8 20 18 11 31 11C40 11 46 16 50 23C54 16 60 11 69 11C82 11 92 20 92 34C92 52 78 68 50 88Z',
  'M10 50a40 40 0 1 0 80 0a40 40 0 1 0 -80 0Z',
  starPath(50, 54, 45, 22),
  'M26 12h48a14 14 0 0 1 14 14v48a14 14 0 0 1 -14 14h-48a14 14 0 0 1 -14 -14v-48a14 14 0 0 1 14 -14Z',
  'M50 7C50 7 83 43 83 62C83 80 68 92 50 92C32 92 17 80 17 62C17 43 50 7 50 7Z',
  'M30 12h40l22 28l-42 52l-42 -52Z',
];
function candySVG(ci, sp) {
  const [L, M, D] = PAL[ci], P = SHAPES[ci];
  const wrapped = sp === 'wrap';
  let wings = '', stripes = '', extra = '';
  if (wrapped) wings =
    `<path d="M24 50L3 31Q-1 50 3 69Z" fill="${M}" stroke="${D}" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="M76 50L97 31Q101 50 97 69Z" fill="${M}" stroke="${D}" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="M8 40L18 48M8 60L18 52M92 40L82 48M92 60L82 52" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
  if (sp === 'lineH') for (const y of [14, 34, 54, 74]) stripes += `<rect x="0" y="${y}" width="100" height="10" fill="#fff" opacity=".92"/>`;
  if (sp === 'lineV') for (const x of [14, 34, 54, 74]) stripes += `<rect x="${x}" y="0" width="10" height="100" fill="#fff" opacity=".92"/>`;
  if (ci === 5) extra = `<path d="M30 12L40 40L50 12L60 40L70 12M8 40H92M40 40L50 92L60 40" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>`;
  if (ci === 1) extra = `<path d="M50 50m-22 0a22 22 0 1 1 44 0" fill="none" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/>`;
  const inner = wrapped ? ' transform="translate(16 16) scale(.68)"' : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>` +
    `<linearGradient id="g" x1=".15" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="${L}"/><stop offset=".48" stop-color="${M}"/><stop offset="1" stop-color="${D}"/></linearGradient>` +
    `<clipPath id="k"><path d="${P}"/></clipPath></defs>${wings}<g${inner}>` +
    `<path d="${P}" transform="translate(0 6)" fill="#2a0030" opacity=".28"/>` +
    `<path d="${P}" fill="url(#g)"/><g clip-path="url(#k)">${extra}${stripes}` +
    `<ellipse cx="36" cy="27" rx="27" ry="13" fill="#fff" opacity=".55" transform="rotate(-25 36 27)"/>` +
    `<ellipse cx="62" cy="88" rx="34" ry="12" fill="${D}" opacity=".4"/></g>` +
    `<path d="${P}" fill="none" stroke="${D}" stroke-width="3.5" stroke-linejoin="round"/>` +
    `<circle cx="27" cy="25" r="5.5" fill="#fff"/><circle cx="38" cy="20" r="2.5" fill="#fff" opacity=".8"/></g></svg>`;
}
function bombSVG() {
  const spr = [[30,30,20,'#ff4d6d'],[52,22,-40,'#ffd400'],[72,34,70,'#3aa6ff'],[24,52,-70,'#46d652'],[46,44,35,'#fff'],
    [66,54,-20,'#ff9a1f'],[34,70,60,'#b363ff'],[56,72,-55,'#ff4d6d'],[78,68,15,'#46d652'],[50,86,80,'#ffd400'],[18,40,10,'#3aa6ff'],[84,48,-80,'#fff']];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="b" cx=".35" cy=".3" r=".8">` +
    `<stop offset="0" stop-color="#a87050"/><stop offset=".55" stop-color="#5a2d14"/><stop offset="1" stop-color="#2a1004"/></radialGradient></defs>` +
    `<circle cx="50" cy="56" r="42" fill="#2a0030" opacity=".3"/><circle cx="50" cy="50" r="42" fill="url(#b)" stroke="#250c02" stroke-width="3"/>` +
    spr.map(([x, y, r, c]) => `<rect x="-6" y="-2.3" width="12" height="4.6" rx="2.3" fill="${c}" transform="translate(${x} ${y}) rotate(${r})"/>`).join('') +
    `<ellipse cx="36" cy="28" rx="18" ry="9" fill="#fff" opacity=".35" transform="rotate(-25 36 28)"/></svg>`;
}
(function injectCandyCSS() {
  const u = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  let css = '';
  for (let ci = 0; ci < 6; ci++) for (const sp of ['n', 'lineH', 'lineV', 'wrap'])
    css += `.cand-${ci}-${sp}{background-image:${u(candySVG(ci, sp === 'n' ? null : sp))}}`;
  css += `.cand-bomb{background-image:${u(bombSVG())}}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();

/* ================= セーブ ================= */
let save = { unlocked: 1, stars: {} };
try { const s = JSON.parse(localStorage.getItem('amamatch-save')); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem('amamatch-save', JSON.stringify(save)); } catch (e) {} }

/* ================= レベル ================= */
function levelDef(n) {
  const colors = n <= 5 ? 5 : 6;
  const mv = Math.max(16, 24 - Math.floor(n / 4));
  if (n % 3 !== 2) {
    const t = 3500 + n * 600;
    return { n, colors, moves: mv, goal: { type: 'score', target: t }, stars: [t, Math.round(t * 1.3), Math.round(t * 1.6)] };
  }
  return { n, colors, moves: mv, goal: { type: 'collect', color: (n * 7) % colors, count: 14 + n * 2 },
           stars: [0, 3000 + n * 600, 5000 + n * 900] };
}

/* ================= 音・振動 ================= */
let actx = null, noiseBuf = null;
function audioUnlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur = .12, type = 'sine', vol = .12, delay = 0) {
  if (!actx) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function sweep(f1, f2, dur, type, vol, delay = 0) {
  if (!actx) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol, f1, f2, delay = 0) {
  if (!actx) return;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = actx.currentTime + delay, s = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = 1.3;
  bp.frequency.setValueAtTime(f1, t0); bp.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(bp).connect(g).connect(actx.destination); s.start(t0); s.stop(t0 + dur + .02);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const sfx = {
  swap: () => sweep(420, 720, .09, 'sine', .07),
  bad: () => { tone(230, .09, 'square', .04); tone(180, .13, 'square', .04, .09); },
  pop: c => { const f = 587 * Math.pow(2, SCALE[Math.min(c - 1, 10)] / 12);
    tone(f, .2, 'sine', .14); tone(f * 2, .14, 'triangle', .05, .025); noise(.07, .18, 3500, 1200); },
  land: () => noise(.05, .06, 1800, 900),
  line: () => { noise(.4, .35, 500, 7000); sweep(1600, 260, .32, 'sawtooth', .05); },
  wrap: () => { sweep(190, 38, .45, 'sine', .4); noise(.35, .35, 900, 150); },
  bomb: () => { sweep(2400, 180, .55, 'square', .05); [0, 4, 7, 12, 16, 19].forEach((s, i) => tone(988 * Math.pow(2, s / 12), .16, 'sine', .07, i * .05)); noise(.6, .22, 6000, 700); },
  make: () => { tone(1318, .15, 'sine', .1); tone(1760, .3, 'sine', .09, .08); tone(2637, .25, 'sine', .04, .14); },
  word: () => [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), .35, 'triangle', .08, i * .07)),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .12, i * .12)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .35, 'triangle', .1, i * .2)),
};
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ================= エフェクト (canvas) ================= */
const fxc = $('fx'), fctx = fxc.getContext('2d');
let parts = [], fxRunning = false, dpr = 1;
function resizeFx() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  fxc.width = innerWidth * dpr; fxc.height = innerHeight * dpr;

    fxBolts(ta.r, ta.c, grid.flat().filter(Boolean).map(t => [t.r, t.c]));
    grid.flat().forEach(t => t && set.add(keyOf(t)));
  } else if (A === 'bomb' || B === 'bomb') {
    const bomb = A === 'bomb' ? ta : tb, other = A === 'bomb' ? tb : ta, kind = other.special;
    bomb.special = null; set.add(keyOf(bomb));
    const targets = grid.flat().filter(t => t && t !== bomb && t.color === other.color);
    fxBolts(bomb.r, bomb.c, targets.map(t => [t.r, t.c])); sfx.bomb(); vib(70); shake(2);
    for (const t of targets) {
      if (kind && !t.special) { t.special = kind === 'wrap' ? 'wrap' : (Math.random() < .5 ? 'lineH' : 'lineV'); styleTile(t); t.gem.classList.add('spawn'); }
      set.add(keyOf(t));
    }
    if (kind) { showWord('へんしん!'); sfx.make(); await wait(600); }
  } else {
    const r0 = ta.r, c0 = ta.c, wA = A === 'wrap', wB = B === 'wrap';
    ta.special = tb.special = null;
    if (wA && wB) {   // つつみ×つつみ:5×5を2回
      for (let r = r0 - 2; r <= r0 + 2; r++) for (let c = c0 - 2; c <= c0 + 2; c++) add(r, c);
      fxShock(r0, c0, 3); sfx.wrap(); vib(80); shake(2);
      tb.special = 'armedBig';
    } else {          // しましま×しましま:十字 / しましま×つつみ:3列ぶんの太い十字
      const w = (wA || wB) ? 1 : 0;
      for (let d = -w; d <= w; d++) { for (let i = 0; i < COLS; i++) { add(r0 + d, i); add(i, c0 + d); }
        if (r0 + d >= 0 && r0 + d < ROWS) fxBeam('h', r0 + d, c0); if (c0 + d >= 0 && c0 + d < COLS) fxBeam('v', r0, c0 + d); }
      sfx.line(); if (w) { sfx.wrap(); showWord('ドーン!'); } vib(60); shake(2);
    }
  }
  const big = tb.special === 'armedBig'; if (big) { tb.special = null; set.delete(keyOf(tb)); }
  await clearCells(set, 1, ta.color >= 0 ? ta.color : tb.color);
  if (big && grid[tb.r][tb.c] === tb) {   // 2回目の大爆発
    await gravity();
    const r0 = tb.r, c0 = tb.c, set2 = new Set([keyOf(tb)]);
    for (let r = r0 - 2; r <= r0 + 2; r++) for (let c = c0 - 2; c <= c0 + 2; c++) if (r >= 0 && r < ROWS && c >= 0 && c < COLS) set2.add(r * COLS + c);
    await wait(200); fxShock(r0, c0, 3); sfx.wrap(); shake(2);
    await clearCells(set2, 2, tb.color);
  }
}

/* ================= 入れ替え ================= */
async function trySwap(a, b) {
  if (busy || ended) return;
  const ta = grid[a.r][a.c], tb = grid[b.r][b.c]; if (!ta || !tb) return;
  busy = true; clearHint(); clearSelect();
  grid[a.r][a.c] = tb; grid[b.r][b.c] = ta; place(ta, b.r, b.c); place(tb, a.r, a.c); sfx.swap();
  await wait(190);
  if (ta.special === 'bomb' || tb.special === 'bomb' || (ta.special && tb.special)) {
    useMove();
    await comboSpecial(ta, tb); await gravity(); await resolveBoard(null);
    return afterMove();
  }
  if (!findGroups().length) {
    sfx.bad();
    grid[a.r][a.c] = ta; grid[b.r][b.c] = tb; place(ta, a.r, a.c); place(tb, b.r, b.c);
    await wait(190); busy = false; resetHint(); return;
  }
  useMove();
  await resolveBoard([a.r * COLS + a.c, b.r * COLS + b.c]);
  afterMove();
}
function useMove() { moves--; updateHud(); const m = $('moves'); m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump'); }
async function shuffle() {
  showWord('シャッフル!'); await wait(500);
  const tiles = grid.flat().filter(Boolean);
  let ok = false;
  for (let i = 0; i < 200 && !ok; i++) {
    for (let j = tiles.length - 1; j > 0; j--) { const k = Math.floor(Math.random() * (j + 1)); [tiles[j], tiles[k]] = [tiles[k], tiles[j]]; }
    tiles.forEach((t, idx) => { grid[Math.floor(idx / COLS)][idx % COLS] = t; t.r = Math.floor(idx / COLS); t.c = idx % COLS; });
    ok = !findGroups().length && !!findMove();
  }
  while (!ok) {
    const g = genColors(); tiles.forEach(t => { if (!t.special) { t.color = g[t.r][t.c]; styleTile(t); } });
    ok = !findGroups().length && !!findMove();
  }
  tiles.forEach(t => { t.el.style.transition = 'transform .4s ease-in-out'; place(t, t.r, t.c); });
  await wait(450); tiles.forEach(t => t.el.style.transition = '');
}

/* ================= 進行 ================= */
function goalDone() { const g = level.goal; return g.type === 'score' ? score >= g.target : collected >= g.count; }
function addScore(n) { score += n; }
async function afterMove() {
  updateHud();
  if (level.goal.type === 'score' && !scoreReached && score >= level.goal.target) { scoreReached = true; showWord('目標たっせい!'); sfx.word(); }
  if (level.goal.type === 'collect' && goalDone()) return finish(true);
  if (moves <= 0) return finish(goalDone());
  if (!findMove()) await shuffle();
  busy = false; resetHint();
}
// クリア後:のこり手数ぶん、しましまに変身して一気に発動(あまあまタイム)
async function sugarTime() {
  if (moves > 0) {
    showWord('あまあまタイム!'); sfx.word(); await wait(800);
    while (moves > 0) {
      const cand = grid.flat().filter(t => t && !t.special); if (!cand.length) break;
      const t = cand[Math.floor(Math.random() * cand.length)];
      t.special = Math.random() < .5 ? 'lineH' : 'lineV'; styleTile(t); t.gem.classList.add('spawn');
      fxSparkles(t.r, t.c, 8, '#fff8c0'); moves--; updateHud();
      tone(660 * Math.pow(2, Math.min(12, level.moves - moves) / 12), .1, 'triangle', .08);
      await wait(120);
    }
  }
  for (let i = 0; i < 8; i++) {   // 盤面に残ったスペシャルも全部発動
    const sp = grid.flat().filter(t => t && t.special);
    if (!sp.length) break;
    await wait(300);
    await clearCells(new Set(sp.map(keyOf)), 1, sp[0].color);
    await gravity(); await resolveBoard(null);
  }
}
async function finish(won) {
  ended = true; busy = true; clearHint();
  await wait(400);
  if (won) {
    await sugarTime();
    await wait(400);
    const st = starsFor(score);
    save.stars[level.n] = Math.max(save.stars[level.n] || 0, st);
    save.unlocked = Math.max(save.unlocked, level.n + 1); persist();
    sfx.win(); vib([30, 60, 30]);
    openModal(`<h2>クリア!</h2>
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < st ? 'on' : ''}" style="animation-delay:${.2 + i * .3}s">★</span>`).join('')}</div>
      <p>スコア ${score.toLocaleString()} 点</p>
      <div class="btns"><button class="btn" data-act="map">マップ</button><button class="btn main" data-act="next">つぎへ ›</button></div>`);
    for (let i = 0; i < st; i++) setTimeout(() => tone(1046 * Math.pow(2, i * 4 / 12), .25, 'triangle', .1), 200 + i * 300);
  } else {
    sfx.lose();
    const g = level.goal;
    const msg = g.type === 'score' ? `あと ${(g.target - score).toLocaleString()} 点だった…` : `あと ${g.count - collected} こだった…`;
    openModal(`<h2>ざんねん…</h2><p>${msg}</p>
      <div class="btns"><button class="btn" data-act="map">マップ</button><button class="btn main" data-act="retry">もういちど</button></div>`);
  }
}
function starsFor(s) {
  let n = level.goal.type === 'collect' ? 1 : 0;
  level.stars.forEach((t, i) => { if (s >= t && i + 1 > n) n = i + 1; });
  return Math.min(3, n);
}
let scoreAnim = null;
function updateHud() {
  $('moves').textContent = Math.max(0, moves);
  $('movesBox').classList.toggle('low', moves <= 5 && !ended);
  const g = level.goal, goalEl = $('goal');
  if (g.type === 'score') goalEl.innerHTML = `目標 <b>${g.target.toLocaleString()}</b> 点`;
  else { const left = Math.max(0, g.count - collected);
    goalEl.innerHTML = `<span class="gem ${candClass(g.color)}"></span> を あと <b>${left}</b> こ`; }
  goalEl.classList.toggle('done', goalDone());
  const max = level.stars[2];
  $('scoreFill').style.width = Math.min(100, score / max * 100) + '%';
  level.stars.forEach((t, i) => { const m = $('m' + i);
    m.style.display = (g.type === 'collect' && i === 0) ? 'none' : '';
    m.style.left = Math.min(97, t / max * 100) + '%'; m.classList.toggle('on', score >= t); });
  if (!scoreAnim) scoreAnim = requestAnimationFrame(function step() {   // 点数がカウントアップ
    shownScore += Math.max(1, Math.ceil((score - shownScore) * .18));
    if (shownScore >= score) shownScore = score;
    $('score').textContent = shownScore.toLocaleString();
    scoreAnim = shownScore < score ? requestAnimationFrame(step) : null;
  });
}

/* ================= ヒント・選択 ================= */
function resetHint() {
  clearHint();
  hintTimer = setTimeout(() => { const m = findMove(); if (m && !busy) m.forEach(([r, c]) => grid[r][c] && grid[r][c].gem.classList.add('hint')); }, 5000);
}
function clearHint() { clearTimeout(hintTimer); board.querySelectorAll('.hint').forEach(e => e.classList.remove('hint')); }
function clearSelect() { if (selected) { const t = grid[selected.r][selected.c]; if (t) t.gem.classList.remove('sel'); } selected = null; }

/* ================= 操作 ================= */
let drag = null;
const cellSize = () => board.getBoundingClientRect().width / COLS;
function cellFromEvent(e) {
  const rc = board.getBoundingClientRect();
  const c = Math.floor((e.clientX - rc.left) / (rc.width / COLS)), r = Math.floor((e.clientY - rc.top) / (rc.height / ROWS));
  return (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? { r, c } : null;
}
board.addEventListener('pointerdown', e => {
  audioUnlock(); if (busy || ended) return;
  const cell = cellFromEvent(e); if (!cell) return;
  drag = { ...cell, x: e.clientX, y: e.clientY, moved: false };
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
});
board.addEventListener('pointermove', e => {
  if (!drag || drag.moved) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = cellSize() * 0.3;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.moved = true;
  let r2 = drag.r, c2 = drag.c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
  if (r2 >= 0 && r2 < ROWS && c2 >= 0 && c2 < COLS) trySwap({ r: drag.r, c: drag.c }, { r: r2, c: c2 });
});
board.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved || busy || ended) return;
  if (selected) {
    const adj = Math.abs(selected.r - d.r) + Math.abs(selected.c - d.c) === 1;
    if (adj) { const s = selected; clearSelect(); trySwap(s, d); return; }
    const same = selected.r === d.r && selected.c === d.c; clearSelect(); if (same) return;
  }
  selected = { r: d.r, c: d.c }; grid[d.r][d.c].gem.classList.add('sel'); tone(880, .05, 'sine', .05);
});
board.addEventListener('pointercancel', () => drag = null);

/* ================= 画面 ================= */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
function layout() {
  resizeFx();
  const w = Math.min(window.innerWidth - 28, 520), h = window.innerHeight - 220;
  const s = Math.max(30, Math.floor(Math.min(w, h) / COLS));
  board.style.setProperty('--s', s + 'px'); board.style.width = s * COLS + 'px'; board.style.height = s * ROWS + 'px';
}
window.addEventListener('resize', layout);

function renderMap() {
  const box = $('levels'); box.innerHTML = '';
  const max = Math.max(30, Math.ceil((save.unlocked + 5) / 5) * 5);
  for (let n = 1; n <= max; n++) {
    const b = document.createElement('button'); b.className = 'lv';
    const st = save.stars[n] || 0;
    if (n > save.unlocked) { b.disabled = true; b.classList.add('locked'); b.textContent = '🔒'; }
    else { b.innerHTML = `<span>${n}</span><small>${'★'.repeat(st)}${'☆'.repeat(3 - st)}</small>`; b.onclick = () => { audioUnlock(); tone(880, .08, 'triangle', .08); startLevel(n); }; }
    if (n === save.unlocked) b.classList.add('current');
    box.appendChild(b);
  }
  const cur = box.querySelector('.current'); if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center' }), 0);
}
async function startLevel(n) {
  closeModal();
  level = levelDef(n); moves = level.moves; score = 0; shownScore = 0; collected = 0; ended = false; busy = true; scoreReached = false; selected = null;
  $('lvNum').textContent = n;
  show('game'); layout(); updateHud();
  await fillInitial();
  const g = level.goal;
  showWord(g.type === 'score' ? `${g.target.toLocaleString()}点めざそう!` : `${g.count}こ あつめよう!`);
  busy = false; resetHint();
}
function openModal(html) { $('card').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
$('card').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  if (act === 'map') { closeModal(); renderMap(); show('map'); }
  if (act === 'retry') startLevel(level.n);
  if (act === 'next') startLevel(level.n + 1);
  if (act === 'resume') closeModal();
});
$('backBtn').onclick = () => {
  if (ended) { renderMap(); show('map'); return; }
  openModal(`<h2 style="font-size:24px">マップにもどる?</h2><p>このレベルはやりなおしになるよ</p>
    <div class="btns"><button class="btn" data-act="resume">つづける</button><button class="btn main" data-act="map">もどる</button></div>`);
};

(function decorate() {
  const bg = $('bg');
  for (let i = 0; i < 10; i++) { const b = document.createElement('i'); const s = 30 + Math.random() * 90;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;animation-duration:${14 + Math.random() * 16}s;animation-delay:-${Math.random() * 30}s`;
    bg.appendChild(b); }
  const row = $('candyrow');
  for (let i = 0; i < 6; i++) { const g = document.createElement('span'); g.className = 'gem ' + candClass(i); g.style.animationDelay = (i * .15) + 's'; row.appendChild(g); }
})();
resizeFx();
renderMap();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
