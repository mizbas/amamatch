<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3a1650">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>あまあまマッチ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>

<section id="map" class="screen active">
  <header class="topbar">
    <div class="coins-now"></div>
    <div class="tb-right">
      <button class="icon-btn" id="shopBtn" aria-label="ショップ"><i class="ico ico-shop"></i></button>
      <button class="icon-btn" id="setBtn" aria-label="せってい"><i class="ico ico-gear"></i></button>
    </div>
  </header>
  <div class="logo-wrap">
    <div class="logo">あまあま<br>マッチ</div>
    <div class="candyrow" id="candyrow"></div>
  </div>
  <div id="worlds"></div>
</section>

<section id="game" class="screen">
  <header class="hud">
    <button id="backBtn" class="icon-btn" aria-label="マップにもどる">‹</button>
    <div class="hud-level"><small id="wName"></small><span id="lvNum">1-1</span></div>
    <div class="hud-moves" id="movesBox"><span>のこり手数</span><b id="moves">20</b></div>
  </header>
  <div class="info">
    <div class="goals" id="goals"></div>
    <div class="scorerow">
      <div class="scorebar"><div id="scoreFill"></div><i class="mark" id="m0">★</i><i class="mark" id="m1">★</i><i class="mark" id="m2">★</i></div>
      <div class="score"><b id="score">0</b> 点</div>
    </div>
  </div>
  <div id="boardWrap"><div id="board"></div><div id="toast"></div></div>
  <div class="boosters">
    <button class="bst" id="bst-hammer"><i class="ico ico-hammer"></i><b></b></button>
    <button class="bst" id="bst-shuffle"><i class="ico ico-shuffle"></i><b></b></button>
  </div>
</section>

<canvas id="fx"></canvas>
<div id="word"></div>
<div id="hand" class="ico-hand"></div>
<div id="bubble"></div>
<div id="tipcard"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>

<script src="js/sounds.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
